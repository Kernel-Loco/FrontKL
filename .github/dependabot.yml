# Dependabot revisa cada semana los paquetes de npm (package.json y package-lock.json) y las acciones de
# .github/workflows, y abre un PR a dev cuando hay una versión nueva.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Con el límite de 5 PR abiertos, next se quedó sin PR cuando ya había 5 (14 nov).
    open-pull-requests-limit: 10
    # Paquetes que se suben juntos en un solo PR, para que no queden desfasados.
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/postcss"]
    ignore:
      # eslint-config-next usa typescript-eslint, que pide typescript '>=4.8.4 <6.1.0'.
      # Con TypeScript 7, que no trae la API de JavaScript, npm run lint falla.
      # Quitar cuando typescript-eslint acepte typescript 6.1 o más, incluida la 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
  # Las acciones del CI de pruebas (checkout y setup-node), en un solo PR, como en BackKL.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
