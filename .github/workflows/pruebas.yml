# CI de pruebas de FrontKL: en cada PR y push a dev o main instala las dependencias con npm ci y corre npm audit,
# npm run lint, npm test (node --test sobre src/**/*.test.mjs, RC-332) y npm run build (RC-293). No usa secretos ni
# la API: el build no pide variables (next.config.ts trae API_INTERNAL_URL por omisión) y solo baja las fuentes de
# next/font/google. src/config/flujoCi.test.mjs revisa que estos pasos sigan aquí.
name: Pruebas

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# En un PR, un push nuevo cancela la corrida anterior. En dev y main no se cancela nada: cada merge queda validado.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # La versión de Node está en .nvmrc y src/config/versionNode.test.mjs revisa que sea la misma de los FROM
      # del Dockerfile. Las pruebas importan .ts directo, así que necesitan Node 22.18 o más, que quita los tipos
      # sin bandera.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: instalar
        run: npm ci

      # Los pasos que siguen corren aunque falle uno anterior, para ver todos los errores en una sola corrida. El
      # job queda en rojo si falla cualquiera.

      # Lo que corre en el servidor de Next (por donde pasa la cookie de sesión) frena con un aviso de cualquier
      # nivel. Las herramientas de desarrollo (ESLint, TypeScript) solo frenan con high o critical (RC-293,
      # decisión 1 de Ernesto, 19 nov). Si un aviso de producción sin versión corregida deja en rojo todos los PR,
      # la salida es un PR que baje ese paso a --audit-level=moderate (y su línea en flujoCi.test.mjs), con una
      # tarjeta de Jira que lo regrese a low cuando salga el parche. Nada de continue-on-error.
      - name: npm audit (producción, cualquier nivel)
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=low

      - name: npm audit (todas, high y critical)
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm audit --audit-level=high

      - name: npm run lint
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run lint

      - name: npm test
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm test

      # next build también revisa los tipos con tsc: un error de tipos lo pone en rojo.
      - name: npm run build
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: npm run build
